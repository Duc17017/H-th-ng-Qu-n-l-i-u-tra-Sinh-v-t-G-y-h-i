databases:
  - name: agrigov-db
    databaseName: agrigov
    user: agrigov
    plan: free

services:
  - type: web
    name: he-thong-quan-li-sinh-vat-gay-hai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: agrigov-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_BEHIND_PROXY
        value: "1"
      - key: REGISTRATION_OPEN
        value: "1"
      - key: REGISTRATION_AUTO_ACTIVE
        value: "1"
      - key: REGISTRATION_MAX_PER_IP
        value: "3"
