{% extends "base_public.html" %}
{% block title %}Đã gửi email{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-space-3xl">
  <div class="bg-white rounded-2xl shadow-sm p-space-xl text-center">
    <span class="msym text-[40px] text-primary">mark_email_read</span>
    <h1 class="font-headline-lg text-headline-lg font-bold text-on-surface my-space-sm">Kiểm tra hộp thư của bạn</h1>
    <p class="font-body-sm text-body-sm text-on-surface-variant">
      Nếu email bạn nhập có trong hệ thống, đường dẫn đặt lại mật khẩu đã được gửi. Hãy kiểm tra cả thư mục thư rác.
    </p>
    <a href="{% url 'accounts:login' %}" class="inline-block mt-space-md font-label-lg text-primary hover:underline">Quay lại đăng nhập</a>
  </div>
</div>
{% endblock %}
