{% load static %}<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không tìm thấy trang — {{ APP_NAME|default:"AgriGov TT&BVTV" }}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        .msym { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
                line-height: 1; display: inline-block; -webkit-font-feature-settings: 'liga';
                -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="min-h-screen bg-surface flex items-center justify-center p-space-xl">
<div class="w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-[0_1px_8px_rgba(0,0,0,0.06)] p-space-2xl text-center">
    <div class="w-16 h-16 mx-auto rounded-full bg-surface-container flex items-center justify-center">
        <span class="msym text-primary text-[32px]">search_off</span>
    </div>
    <h1 class="mt-space-lg font-display-sm text-display-sm text-on-surface">Không tìm thấy trang</h1>
    <p class="mt-space-sm font-body-md text-body-md text-on-surface-variant">
        Địa chỉ bạn truy cập không tồn tại, hoặc nội dung đã được di chuyển.
    </p>
    <p class="mt-space-xs font-label-md text-label-md text-outline">Mã lỗi 404 — Not Found</p>
    <div class="mt-space-xl flex items-center justify-center gap-space-sm">
        <a href="javascript:history.back()"
           class="h-10 px-space-lg rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg inline-flex items-center gap-1.5">
            <span class="msym text-[18px]">arrow_back</span>Quay lại
        </a>
        <a href="/"
           class="h-10 px-space-lg rounded-xl bg-primary hover:bg-primary-container text-white font-label-lg inline-flex items-center gap-1.5">
            <span class="msym text-[18px]">home</span>Trang chủ
        </a>
    </div>
</div>
</body>
</html>
